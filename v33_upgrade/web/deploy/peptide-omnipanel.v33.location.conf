# -------- Peptide OmniPanel V33 (FastAPI + SPA 127.0.0.1:7863 -> V33 engine :8902) --------
# Instant rollback: restore /etc/nginx/snippets/peptide-omnipanel.location.conf.v32.bak (127.0.0.1:7862)
location = /peptide-omnipanel { return 301 /peptide-omnipanel/; }

location ^~ /peptide-omnipanel/ {
    proxy_pass http://127.0.0.1:7863/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    client_max_body_size 15M;
}

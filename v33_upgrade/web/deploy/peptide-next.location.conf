# Ready-to-apply Nginx staging location snippet for Peptide OmniPanel V33
# Target file on node2: /etc/nginx/sites-available/lmmd.ecust.edu.cn (inside server {} block)
# Exposes V33 staging at https://lmmd.ecust.edu.cn/peptide-next/ without affecting live V31/V32!

location = /peptide-next {
    return 301 /peptide-next/;
}

location /peptide-next/ {
    proxy_pass http://127.0.0.1:7863/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /peptide-next;
    proxy_connect_timeout 30s;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    client_max_body_size 25M;
}

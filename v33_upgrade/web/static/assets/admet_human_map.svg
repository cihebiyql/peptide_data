<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Human ADMET Physiological Barriers & ESKAPE Antimicrobial Map" class="admet-map-svg">
  <defs>
    <linearGradient id="bodyFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--cobalt, #0369A1)" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="var(--teal, #0D9488)" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="var(--cobalt, #0369A1)" stop-opacity="0.11"/>
    </linearGradient>
    <radialGradient id="coreHalo" cx="50%" cy="44%" r="44%">
      <stop offset="0%" stop-color="var(--cobalt, #0369A1)" stop-opacity="0.13"/>
      <stop offset="65%" stop-color="var(--teal, #0D9488)" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="var(--cobalt, #0369A1)" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardSoftShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Subtle Ambient Halo Behind Silhouette -->
  <ellipse cx="320" cy="248" rx="145" ry="205" fill="url(#coreHalo)" pointer-events="none"/>

  <!-- Subtle Coordinate Grid Guides (Scientific Precision) -->
  <g stroke="var(--border, #E2E8F0)" stroke-width="0.8" stroke-dasharray="2,5" opacity="0.55" pointer-events="none">
    <line x1="320" y1="22" x2="320" y2="466"/>
    <circle cx="320" cy="246" r="118" fill="none"/>
    <circle cx="320" cy="246" r="168" fill="none"/>
  </g>

  <!-- Minimalist Human Physiological Silhouette (Head + Neck + Shoulders + Torso) -->
  <g class="human-silhouette" pointer-events="none">
    <!-- Head & Cranium -->
    <path d="M 320 42
             C 348 42, 366 64, 366 94
             C 366 116, 355 135, 341 144
             L 341 162
             C 374 168, 405 186, 412 222
             L 422 316
             C 424 334, 410 344, 398 340
             L 387 268
             L 383 438
             C 383 452, 370 462, 354 462
             L 286 462
             C 270 462, 257 452, 257 438
             L 253 268
             L 242 340
             C 230 344, 216 334, 218 316
             L 228 222
             C 235 186, 266 168, 299 162
             L 299 144
             C 285 135, 274 116, 274 94
             C 274 64, 292 42, 320 42 Z"
          fill="url(#bodyFillGrad)"
          stroke="var(--border-strong, #CBD5E1)"
          stroke-width="1.6"
          stroke-linejoin="round"/>

    <!-- Systemic Vascular Circulation Loop (Animated Flow) -->
    <path d="M 320 112 L 320 176 C 344 186, 352 216, 344 252 C 337 284, 346 312, 336 346 C 328 372, 312 372, 304 346 C 294 312, 302 282, 296 248 C 289 214, 298 186, 320 176"
          fill="none" stroke="var(--cobalt, #0369A1)" stroke-opacity="0.22" stroke-width="2.2"/>
    <path class="flow-pulse" d="M 320 112 L 320 176 C 344 186, 352 216, 344 252 C 337 284, 346 312, 336 346 C 328 372, 312 372, 304 346 C 294 312, 302 282, 296 248 C 289 214, 298 186, 320 176"
          fill="none" stroke="var(--teal, #0D9488)" stroke-opacity="0.65" stroke-width="1.8" stroke-dasharray="5 7"/>

    <!-- Brain + BBB Protective Arc -->
    <g transform="translate(320, 88)">
      <path d="M -22 2 C -26 -14, -12 -24, 0 -22 C 12 -24, 26 -14, 22 2 C 25 12, 14 19, 2 15 L 0 12 L -2 15 C -14 19, -25 12, -22 2 Z"
            fill="var(--violet, #7C3AED)" fill-opacity="0.16" stroke="var(--violet, #7C3AED)" stroke-width="1.4"/>
      <path d="M 0 -20 L 0 12 M -13 -8 C -7 -4, -7 4, -12 7 M 13 -8 C 7 -4, 7 4, 12 7"
            fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
      <path d="M -30 -6 A 32 28 0 0 1 30 -6" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7"/>
    </g>

    <!-- Heart / Albumin Circulation Carrier (Center-Right Chest) -->
    <g transform="translate(333, 206)">
      <ellipse cx="0" cy="0" rx="18" ry="13" fill="var(--amber, #D97706)" fill-opacity="0.15" stroke="var(--amber, #D97706)" stroke-width="1.35"/>
      <path d="M -10 -2 C -4 -8, 4 6, 10 -1" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="9" cy="-1" r="2.2" fill="var(--amber, #D97706)"/>
    </g>

    <!-- Vascular RBC & Hemolysis Site (Left Chest/Vessel) -->
    <g transform="translate(285, 224)">
      <ellipse cx="0" cy="0" rx="13" ry="9" fill="var(--rose, #E11D48)" fill-opacity="0.16" stroke="var(--rose, #E11D48)" stroke-width="1.35"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="3.6" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.0" opacity="0.8"/>
    </g>

    <!-- Liver & Renal Clearance Organs (Right Abdomen) -->
    <g transform="translate(340, 286)">
      <path d="M -16 -8 C -8 -16, 14 -14, 18 -4 C 21 3, 10 9, -4 9 C -14 9, -20 0, -16 -8 Z"
            fill="var(--teal, #0D9488)" fill-opacity="0.17" stroke="var(--teal, #0D9488)" stroke-width="1.35"/>
      <path d="M 6 12 C 14 12, 18 20, 14 27 C 11 32, 3 31, 2 25 C 1 22, 4 21, 4 19 C 4 17, 1 15, 6 12 Z"
            fill="var(--teal, #0D9488)" fill-opacity="0.17" stroke="var(--teal, #0D9488)" stroke-width="1.3"/>
    </g>

    <!-- GI / Epithelial Membrane Barrier (Lower Center Abdomen) -->
    <g transform="translate(306, 356)">
      <rect x="-24" y="-12" width="48" height="24" rx="10" fill="var(--cobalt, #0369A1)" fill-opacity="0.12" stroke="var(--cobalt, #0369A1)" stroke-width="1.35"/>
      <path d="M -16 -4 C -8 -9, 0 1, 8 -4 C 14 -7, 16 -3, 16 -3 M -16 5 C -8 0, 0 10, 8 5 C 14 2, 16 6, 16 6"
            fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.25" stroke-linecap="round"/>
    </g>

    <!-- Peripheral ESKAPE Bacteria & Biofilm Target (Lower Right) -->
    <g transform="translate(356, 412)">
      <rect x="-14" y="-6.5" width="28" height="13" rx="6.5" transform="rotate(-18)"
            fill="var(--emerald, #059669)" fill-opacity="0.18" stroke="var(--emerald, #059669)" stroke-width="1.35"/>
      <path d="M 11 -11 C 18 -14, 21 -8, 26 -11 M -14 9 C -20 12, -23 6, -27 9"
            fill="none" stroke="var(--emerald, #059669)" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- ==================== 6 INTERACTIVE HOTSPOT GROUPS ==================== -->

  <!-- 1. BBB / CNS Barrier -->
  <g class="admet-hotspot" data-hotspot="bbb" tabindex="0" role="button" aria-label="BBB and CNS Barrier">
    <path class="hs-leader" d="M 194 84 C 232 84, 252 88, 286 88" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="290" cy="88" r="7" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="290" cy="88" r="4.2" fill="var(--violet, #7C3AED)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="8" y="48" width="186" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="8" y="48" width="4" height="72" rx="2" fill="var(--violet, #7C3AED)"/>
      <circle cx="32" cy="84" r="14" fill="var(--violet, #7C3AED)" fill-opacity="0.13"/>
      <!-- Brain Shield Icon -->
      <path d="M 32 74 L 40 77.5 V 84.5 C 40 89.2, 36.5 92.6, 32 94 C 27.5 92.6, 24 89.2, 24 84.5 V 77.5 Z"
            fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 29 84 L 31.2 86.2 L 35.5 81.8" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="hs-title" x="54" y="75" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_bbb_t">血脑屏障 · BBB</text>
      <text class="hs-sub" x="54" y="92" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_bbb_s">CNS 入脑渗透评估</text>
      <text class="hs-stat" x="54" y="109" font-size="10.2" font-weight="600" fill="var(--violet, #7C3AED)" data-svg-stat="bbb">ROC 0.899</text>
    </g>
  </g>

  <!-- 2. Safety: RBC Hemolysis & Mammalian Cytotoxicity -->
  <g class="admet-hotspot" data-hotspot="safety" tabindex="0" role="button" aria-label="RBC Hemolysis and Cytotoxicity">
    <path class="hs-leader" d="M 194 224 C 228 224, 246 224, 269 224" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="272" cy="224" r="7" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="272" cy="224" r="4.2" fill="var(--rose, #E11D48)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="8" y="188" width="186" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="8" y="188" width="4" height="72" rx="2" fill="var(--rose, #E11D48)"/>
      <circle cx="32" cy="224" r="14" fill="var(--rose, #E11D48)" fill-opacity="0.13"/>
      <!-- RBC Cell Icon -->
      <circle cx="32" cy="224" r="8.2" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.6"/>
      <ellipse cx="32" cy="224" rx="4.2" ry="2.4" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.3"/>
      <text class="hs-title" x="54" y="215" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_safety_t">溶血与细胞毒</text>
      <text class="hs-sub" x="54" y="232" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_safety_s">HC50 · MHC · CC50 · 毒性</text>
      <text class="hs-stat" x="54" y="249" font-size="10.2" font-weight="600" fill="var(--rose, #E11D48)" data-svg-stat="safety">0/17 临床误报</text>
    </g>
  </g>

  <!-- 3. GI / Membrane Permeability & Efflux -->
  <g class="admet-hotspot" data-hotspot="gut" tabindex="0" role="button" aria-label="GI and Membrane Permeability">
    <path class="hs-leader" d="M 194 364 C 232 364, 250 358, 280 356" fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="282" cy="356" r="7" fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="282" cy="356" r="4.2" fill="var(--cobalt, #0369A1)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="8" y="328" width="186" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="8" y="328" width="4" height="72" rx="2" fill="var(--cobalt, #0369A1)"/>
      <circle cx="32" cy="364" r="14" fill="var(--cobalt, #0369A1)" fill-opacity="0.13"/>
      <!-- Bilayer Crossing Icon -->
      <line x1="23" y1="360" x2="41" y2="360" stroke="var(--cobalt, #0369A1)" stroke-width="1.5" stroke-dasharray="2.5 2"/>
      <line x1="23" y1="368" x2="41" y2="368" stroke="var(--cobalt, #0369A1)" stroke-width="1.5" stroke-dasharray="2.5 2"/>
      <path d="M 32 353 V 374 M 29 371 L 32 375 L 35 371" fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="hs-title" x="54" y="355" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_gut_t">肠膜渗透与外排</text>
      <text class="hs-sub" x="54" y="372" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_gut_s">PAMPA · Caco-2 · ER</text>
      <text class="hs-stat" x="54" y="389" font-size="10.2" font-weight="600" fill="var(--cobalt, #0369A1)" data-svg-stat="gut">Caco-2 ρ 0.853</text>
    </g>
  </g>

  <!-- 4. Albumin Long-Acting T1/2 & PPB (Default Active) -->
  <g class="admet-hotspot is-active" data-hotspot="pk" tabindex="0" role="button" aria-label="Albumin Long-Acting Half-Life and PPB">
    <path class="hs-leader" d="M 446 148 C 410 148, 390 198, 353 204" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="351" cy="204" r="7" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="351" cy="204" r="4.2" fill="var(--amber, #D97706)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="446" y="112" width="186" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="446" y="112" width="4" height="72" rx="2" fill="var(--amber, #D97706)"/>
      <circle cx="470" cy="148" r="14" fill="var(--amber, #D97706)" fill-opacity="0.14"/>
      <!-- Clock / Half-Life Icon -->
      <circle cx="470" cy="148" r="8" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.6"/>
      <path d="M 470 143.5 V 148 L 473.5 150.5" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.6" stroke-linecap="round"/>
      <text class="hs-title" x="492" y="139" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_pk_t">白蛋白长效 T½</text>
      <text class="hs-sub" x="492" y="156" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_pk_s">脂化锚定 · 蛋白结合 PPB</text>
      <text class="hs-stat" x="492" y="173" font-size="10.2" font-weight="600" fill="var(--amber, #D97706)" data-svg-stat="pk">17 药 ρ 0.903</text>
    </g>
  </g>

  <!-- 5. Hepatic / Renal Clearance, Vd & F -->
  <g class="admet-hotspot" data-hotspot="clearance" tabindex="0" role="button" aria-label="Hepatic and Renal Clearance and Volume of Distribution">
    <path class="hs-leader" d="M 446 288 C 412 288, 394 288, 362 288" fill="none" stroke="var(--teal, #0D9488)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="358" cy="288" r="7" fill="none" stroke="var(--teal, #0D9488)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="358" cy="288" r="4.2" fill="var(--teal, #0D9488)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="446" y="252" width="186" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="446" y="252" width="4" height="72" rx="2" fill="var(--teal, #0D9488)"/>
      <circle cx="470" cy="288" r="14" fill="var(--teal, #0D9488)" fill-opacity="0.14"/>
      <!-- Filtration / Flow Icon -->
      <path d="M 463 283 H 477 L 472 289 V 295 L 468 293 V 289 Z"
            fill="none" stroke="var(--teal, #0D9488)" stroke-width="1.55" stroke-linejoin="round"/>
      <text class="hs-title" x="492" y="279" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_cl_t">肝肾清除与分布</text>
      <text class="hs-sub" x="492" y="296" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_cl_s">CL · Vd · F · LogD / 溶解</text>
      <text class="hs-stat" x="492" y="313" font-size="10.2" font-weight="600" fill="var(--teal, #0D9488)" data-svg-stat="clearance">CL/kg ρ 0.832</text>
    </g>
  </g>

  <!-- 6. ESKAPE Pathogens & Biofilm -->
  <g class="admet-hotspot" data-hotspot="micro" tabindex="0" role="button" aria-label="ESKAPE Antimicrobial and Biofilm Spectrum">
    <path class="hs-leader" d="M 446 420 C 414 420, 400 414, 376 412" fill="none" stroke="var(--emerald, #059669)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="372" cy="412" r="7" fill="none" stroke="var(--emerald, #059669)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="372" cy="412" r="4.2" fill="var(--emerald, #059669)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="446" y="384" width="186" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="446" y="384" width="4" height="72" rx="2" fill="var(--emerald, #059669)"/>
      <circle cx="470" cy="420" r="14" fill="var(--emerald, #059669)" fill-opacity="0.14"/>
      <!-- Bacteria Capsule Icon -->
      <rect x="462.5" y="415.5" width="15" height="9" rx="4.5" transform="rotate(-25 470 420)"
            fill="none" stroke="var(--emerald, #059669)" stroke-width="1.6"/>
      <circle cx="467.5" cy="421" r="1.2" fill="var(--emerald, #059669)"/>
      <circle cx="472.5" cy="419" r="1.2" fill="var(--emerald, #059669)"/>
      <text class="hs-title" x="492" y="411" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_micro_t">ESKAPE 抗菌与生物膜</text>
      <text class="hs-sub" x="492" y="428" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_micro_s">MIC · MBC · MFC · MBIC</text>
      <text class="hs-stat" x="492" y="445" font-size="10.2" font-weight="600" fill="var(--emerald, #059669)" data-svg-stat="micro">22 菌种独立端点</text>
    </g>
  </g>

  <!-- Bottom Physiological Flow Strip -->
  <g transform="translate(0, 488)" pointer-events="none">
    <rect x="74" y="0" width="492" height="24" rx="12" fill="var(--surface-subtle, #F8FAFC)" stroke="var(--border, #E2E8F0)" stroke-width="1"/>
    <text x="320" y="15.5" text-anchor="middle" font-size="10.8" font-weight="600" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_flow_strip">给药入体 (SC / IV / PO)  →  白蛋白循环  →  屏障渗透与清除  →  安全窗与靶向抗菌</text>
  </g>
</svg>

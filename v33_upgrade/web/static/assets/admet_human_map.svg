<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Human ADMET Physiological Barriers &amp; ESKAPE Antimicrobial Map" class="admet-map-svg">
  <defs>
    <radialGradient id="coreHalo" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="var(--cobalt, #0369A1)" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="var(--teal, #0D9488)" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="var(--cobalt, #0369A1)" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardSoftShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Subtle Ambient Halo Behind Anatomical Plate -->
  <ellipse cx="320" cy="240" rx="134" ry="206" fill="url(#coreHalo)" pointer-events="none"/>

  <!-- Subtle Scientific Coordinate Guides -->
  <g stroke="var(--border, #E2E8F0)" stroke-width="0.75" stroke-dasharray="2,5" opacity="0.42" pointer-events="none">
    <line x1="320" y1="16" x2="320" y2="466"/>
    <circle cx="320" cy="240" r="122" fill="none"/>
  </g>

  <!-- Publication-Grade Medical-Atlas Human Anatomy Illustration (Alpha-Matted RGBA PNG) -->
  <image id="admet-anatomy-img"
         class="admet-anatomy-img"
         href="static/assets/admet_human_anatomy.png?v=1.3"
         x="199.7" y="24" width="240.6" height="432"
         preserveAspectRatio="xMidYMid meet"
         pointer-events="none"/>

  <!-- ==================== 6 INTERACTIVE HOTSPOT GROUPS ==================== -->

  <!-- 1. BBB / CNS Barrier -> Left Cerebral Hemisphere (302.8, 58.6) -->
  <g class="admet-hotspot" data-hotspot="bbb" tabindex="0" role="button" aria-label="BBB and CNS Barrier">
    <path class="hs-leader" d="M 190 68 C 228 68, 256 59, 299 59" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="303" cy="59" r="6.8" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="303" cy="59" r="4" fill="var(--violet, #7C3AED)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="6" y="32" width="184" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="6" y="32" width="4" height="72" rx="2" fill="var(--violet, #7C3AED)"/>
      <circle cx="30" cy="68" r="14" fill="var(--violet, #7C3AED)" fill-opacity="0.13"/>
      <path d="M 30 58 L 38 61.5 V 68.5 C 38 73.2, 34.5 76.6, 30 78 C 25.5 76.6, 22 73.2, 22 68.5 V 61.5 Z"
            fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 27 68 L 29.2 70.2 L 33.5 65.8" fill="none" stroke="var(--violet, #7C3AED)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="hs-title" x="52" y="59" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_bbb_t">血脑屏障 · BBB</text>
      <text class="hs-sub" x="52" y="76" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_bbb_s">CNS 入脑渗透评估</text>
      <text class="hs-stat" x="52" y="93" font-size="10.2" font-weight="600" fill="var(--violet, #7C3AED)" data-svg-stat="bbb">ROC 0.899</text>
    </g>
  </g>

  <!-- 2. Safety: RBC Hemolysis & Mammalian Cytotoxicity -> Right Subclavian Vessel (283.8, 175.1) -->
  <g class="admet-hotspot" data-hotspot="safety" tabindex="0" role="button" aria-label="RBC Hemolysis and Cytotoxicity">
    <path class="hs-leader" d="M 190 198 C 224 198, 248 175, 280 175" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="284" cy="175" r="6.8" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="284" cy="175" r="4" fill="var(--rose, #E11D48)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="6" y="162" width="184" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="6" y="162" width="4" height="72" rx="2" fill="var(--rose, #E11D48)"/>
      <circle cx="30" cy="198" r="14" fill="var(--rose, #E11D48)" fill-opacity="0.13"/>
      <circle cx="30" cy="198" r="8.2" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.6"/>
      <ellipse cx="30" cy="198" rx="4.2" ry="2.4" fill="none" stroke="var(--rose, #E11D48)" stroke-width="1.3"/>
      <text class="hs-title" x="52" y="189" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_safety_t">溶血与细胞毒</text>
      <text class="hs-sub" x="52" y="206" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_safety_s">HC50 · MHC · CC50 · 毒性</text>
      <text class="hs-stat" x="52" y="223" font-size="10.2" font-weight="600" fill="var(--rose, #E11D48)" data-svg-stat="safety">0/17 临床误报</text>
    </g>
  </g>

  <!-- 3. GI / Membrane Permeability & Efflux -> Absorptive Small-Intestine Coils (294.2, 362.7) -->
  <g class="admet-hotspot" data-hotspot="gut" tabindex="0" role="button" aria-label="GI and Membrane Permeability">
    <path class="hs-leader" d="M 190 363 C 228 363, 254 363, 290 363" fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="294" cy="363" r="6.8" fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="294" cy="363" r="4" fill="var(--cobalt, #0369A1)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="6" y="327" width="184" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="6" y="327" width="4" height="72" rx="2" fill="var(--cobalt, #0369A1)"/>
      <circle cx="30" cy="363" r="14" fill="var(--cobalt, #0369A1)" fill-opacity="0.13"/>
      <line x1="21" y1="359" x2="39" y2="359" stroke="var(--cobalt, #0369A1)" stroke-width="1.5" stroke-dasharray="2.5 2"/>
      <line x1="21" y1="367" x2="39" y2="367" stroke="var(--cobalt, #0369A1)" stroke-width="1.5" stroke-dasharray="2.5 2"/>
      <path d="M 30 352 V 373 M 27 370 L 30 374 L 33 370" fill="none" stroke="var(--cobalt, #0369A1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="hs-title" x="52" y="354" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_gut_t">肠膜渗透与外排</text>
      <text class="hs-sub" x="52" y="371" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_gut_s">PAMPA · Caco-2 · ER</text>
      <text class="hs-stat" x="52" y="388" font-size="10.2" font-weight="600" fill="var(--cobalt, #0369A1)" data-svg-stat="gut">Caco-2 ρ 0.853</text>
    </g>
  </g>

  <!-- 4. Albumin Long-Acting T1/2 & PPB (Default Active) -> Heart & Systemic Circulation (335.5, 233.7) -->
  <g class="admet-hotspot is-active" data-hotspot="pk" tabindex="0" role="button" aria-label="Albumin Long-Acting Half-Life and PPB">
    <path class="hs-leader" d="M 450 154 C 414 154, 384 234, 340 234" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="336" cy="234" r="6.8" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="336" cy="234" r="4" fill="var(--amber, #D97706)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="450" y="118" width="184" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="450" y="118" width="4" height="72" rx="2" fill="var(--amber, #D97706)"/>
      <circle cx="474" cy="154" r="14" fill="var(--amber, #D97706)" fill-opacity="0.14"/>
      <circle cx="474" cy="154" r="8" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.6"/>
      <path d="M 474 149.5 V 154 L 477.5 156.5" fill="none" stroke="var(--amber, #D97706)" stroke-width="1.6" stroke-linecap="round"/>
      <text class="hs-title" x="496" y="145" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_pk_t">白蛋白长效 T½</text>
      <text class="hs-sub" x="496" y="162" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_pk_s">脂化锚定 · 蛋白结合 PPB</text>
      <text class="hs-stat" x="496" y="179" font-size="10.2" font-weight="600" fill="var(--amber, #D97706)" data-svg-stat="pk">17 药 ρ 0.894</text>
    </g>
  </g>

  <!-- 5. Hepatic / Renal Clearance, Vd & F -> Forked Dual-Anchor on Left Kidney (354, 301) & Liver Lobe (339, 266) -->
  <g class="admet-hotspot" data-hotspot="clearance" tabindex="0" role="button" aria-label="Hepatic and Renal Clearance and Volume of Distribution">
    <path class="hs-leader" d="M 450 288 C 414 288, 392 301, 358 301 M 412 288 C 388 288, 368 266, 343 266" fill="none" stroke="var(--teal, #0D9488)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="354" cy="301" r="6.8" fill="none" stroke="var(--teal, #0D9488)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="354" cy="301" r="4" fill="var(--teal, #0D9488)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <circle class="hs-anchor-dot" cx="339" cy="266" r="3.2" fill="var(--teal, #0D9488)" stroke="var(--surface, #FFFFFF)" stroke-width="1.5"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="450" y="252" width="184" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="450" y="252" width="4" height="72" rx="2" fill="var(--teal, #0D9488)"/>
      <circle cx="474" cy="288" r="14" fill="var(--teal, #0D9488)" fill-opacity="0.14"/>
      <path d="M 467 283 H 481 L 476 289 V 295 L 472 293 V 289 Z"
            fill="none" stroke="var(--teal, #0D9488)" stroke-width="1.55" stroke-linejoin="round"/>
      <text class="hs-title" x="496" y="279" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_cl_t">肝肾清除与分布</text>
      <text class="hs-sub" x="496" y="296" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_cl_s">CL · Vd · F · LogD / 溶解</text>
      <text class="hs-stat" x="496" y="313" font-size="10.2" font-weight="600" fill="var(--teal, #0D9488)" data-svg-stat="clearance">CL/kg ρ 0.832</text>
    </g>
  </g>

  <!-- 6. ESKAPE Pathogens & Biofilm -> Peripheral Lower Vascular / Soft Tissue (371.7, 408.8) -->
  <g class="admet-hotspot" data-hotspot="micro" tabindex="0" role="button" aria-label="ESKAPE Antimicrobial and Biofilm Spectrum">
    <path class="hs-leader" d="M 450 409 C 420 409, 402 409, 376 409" fill="none" stroke="var(--emerald, #059669)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="hs-pulse-ring" cx="372" cy="409" r="6.8" fill="none" stroke="var(--emerald, #059669)" stroke-width="1.5"/>
    <circle class="hs-anchor-dot" cx="372" cy="409" r="4" fill="var(--emerald, #059669)" stroke="var(--surface, #FFFFFF)" stroke-width="1.8"/>
    <g class="hs-card" filter="url(#cardSoftShadow)">
      <rect x="450" y="373" width="184" height="72" rx="11" fill="var(--surface, #FFFFFF)" stroke="var(--border, #E2E8F0)" stroke-width="1.3"/>
      <rect x="450" y="373" width="4" height="72" rx="2" fill="var(--emerald, #059669)"/>
      <circle cx="474" cy="409" r="14" fill="var(--emerald, #059669)" fill-opacity="0.14"/>
      <rect x="466.5" y="404.5" width="15" height="9" rx="4.5" transform="rotate(-25 474 409)"
            fill="none" stroke="var(--emerald, #059669)" stroke-width="1.6"/>
      <circle cx="471.5" cy="410" r="1.2" fill="var(--emerald, #059669)"/>
      <circle cx="476.5" cy="408" r="1.2" fill="var(--emerald, #059669)"/>
      <text class="hs-title" x="496" y="400" font-size="12.2" font-weight="700" fill="var(--ink, #0F172A)" data-svg-i18n="map_micro_t">ESKAPE 抗菌与生物膜</text>
      <text class="hs-sub" x="496" y="417" font-size="10" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_micro_s">MIC · MBC · MFC · MBIC</text>
      <text class="hs-stat" x="496" y="434" font-size="10.2" font-weight="600" fill="var(--emerald, #059669)" data-svg-stat="micro">22 菌种独立端点</text>
    </g>
  </g>

  <!-- Bottom Physiological Flow Strip -->
  <g transform="translate(0, 484)" pointer-events="none">
    <rect x="74" y="0" width="492" height="24" rx="12" fill="var(--surface-subtle, #F8FAFC)" stroke="var(--border, #E2E8F0)" stroke-width="1"/>
    <text x="320" y="15.5" text-anchor="middle" font-size="10.8" font-weight="600" fill="var(--ink-muted, #64748B)" data-svg-i18n="map_flow_strip">给药入体 (SC / IV / PO)  →  白蛋白循环  →  屏障渗透与清除  →  安全窗与靶向抗菌</text>
  </g>
</svg>
